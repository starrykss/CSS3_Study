<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Box Model Assignment</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main class="assignment">
      <p class="eyebrow">CSS box model</p>
      <h1>Two boxes, one layout.</h1>
      <p class="intro">
        Each box has its own padding, border, margin, height, and width. Hover
        over the visible box to see the pseudo-class effect.
      </p>

      <div class="box-row">
        <div class="box box--first">
          <span class="box__number">01</span>
          <h2>I'm a box!</h2>
          <p>
            This is the first box. It is hidden with <code>display: none</code>.
          </p>
        </div>

        <div class="box box--last">
          <span class="box__number">02</span>
          <h2>I'm another box!</h2>
          <p>I'm the last <code>div</code>, so hover over me.</p>
        </div>
      </div>
    </main>
  </body>
</html>
